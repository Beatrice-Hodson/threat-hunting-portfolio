  network:
    segments:
    - name: hq_workstations
      cidr: 10.10.1.0/24
      exposure: internal
    - name: hq_servers
      cidr: 10.10.2.0/24
      exposure: internal
    - name: dmz
      cidr: 10.10.3.0/24
      exposure: both
    - name: branch
      cidr: 10.20.1.0/24
      exposure: internal
    sensors:
    - type: network
      name: core-tap
      hostname: ZEEK-CORE
      monitoring_segments:
      - hq_workstations
      - hq_servers
      - branch
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
    - type: network
      name: dmz-tap
      hostname: ZEEK-DMZ
      monitoring_segments:
      - dmz
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
    - type: ids
      name: ids-edge
      hostname: IDS-EDGE
      monitoring_segments:
      - dmz
      direction: bidirectional
      placement: tap
      log_formats:
      - snort_alert
    - type: firewall
      name: fw-edge
      hostname: FW-EDGE
      monitoring_segments:
      - hq_workstations
      - hq_servers
      - dmz
      - branch
      direction: bidirectional
      placement: tap
      log_formats:
      - cisco_asa
      interfaces:
        hq_workstations: inside
        hq_servers: inside
        branch: inside
        dmz: dmz
      default_action: deny
      deny_ratio: 5.0
      threat_detection_rate: 10
      nat_rules:
      - type: dynamic_pat
        src:
        - hq_workstations
        - hq_servers
        - branch
        mapped_ip: 45.61.200.1
      - type: static
        real_ip: 10.10.3.10
        mapped_ip: 45.61.200.10
      policy:
      - src: external
        dst: dmz
        ports:
        - 80
        - 443
      - src: hq_workstations
        dst: any
      - src: branch
        dst: any
      - src: hq_servers
        dst: external
        ports:
        - 80
        - 443
        - 53
      - src: hq_servers
        dst: hq_servers
    public_cidrs:
    - 45.61.200.0/28
  proxy:
    mode: explicit
