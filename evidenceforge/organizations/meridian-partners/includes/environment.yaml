    services:
    - mssql
    - quickbooks_enterprise
  - hostname: WEB-DMZ-01
    ip: 10.10.3.10
    os: Ubuntu 22.04
    type: server
    roles:
    - web_server
    services:
    - nginx
    - https
  - hostname: PROXY-HQ-01
    ip: 10.10.2.13
    os: Ubuntu 22.04
    type: server
    roles:
    - forward_proxy
    services:
    - squid
  - hostname: FILE-BR-01
    ip: 10.20.1.30
    os: Windows Server 2022
    type: server
    roles:
