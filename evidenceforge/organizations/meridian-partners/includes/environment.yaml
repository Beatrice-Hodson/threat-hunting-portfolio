    - dns_server
  - hostname: FILE-HQ-01
    ip: 10.10.2.11
    os: Windows Server 2022
    type: server
    roles:
    - file_server
  - hostname: APP-HQ-01
    ip: 10.10.2.12
    os: Windows Server 2022
    type: server
    roles:
